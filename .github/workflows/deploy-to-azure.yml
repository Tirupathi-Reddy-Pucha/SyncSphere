name: Deploy SyncSphere to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build, Test & Deploy to Azure

    steps:
      - name: 🔍 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: 🔨 Build React Production Bundle
        run: npm run build
        working-directory: ./frontend

      - name: 📦 Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: 📂 Prepare Deployment Structure
        run: |
          mkdir -p deploy
          cp -r frontend/dist deploy/frontend
          cp -r backend/src deploy/src
          cp backend/package.json deploy/package.json
          cp backend/package-lock.json deploy/package-lock.json || true
          echo "✅ Deployment package prepared"

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-syncsphere-api-2026'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './deploy'

      - name: ✅ Verify Deployment Health
        run: |
          echo "Waiting 30s for app to restart..."
          sleep 30
          curl -f https://app-syncsphere-api-2026.azurewebsites.net/health || echo "Health check returned non-200"
